<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>本地音画预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080e18;color:#eaf0f6;font:15px system-ui;padding:20px}
main{max-width:1440px;margin:auto}iframe{border:0;width:100%;aspect-ratio:16/9;display:block;background:#080e18}
footer{display:flex;gap:16px;align-items:center;padding:16px 0;flex-wrap:wrap}input{flex:1;min-width:260px}audio{width:440px;max-width:100%}p{color:#a6b4c5}
</style></head><body><main><iframe id="view" src="index.html"></iframe>
<footer><audio id="audio" controls></audio><input id="seek" type="range" min="0" max="4777" step="1" value="0"><output id="time">0.000s</output></footer>
<p id="status">加载中。音乐预览需先运行 mix；拖动滑块可逐帧检查画面。</p>
</main><script>
const view=document.getElementById('view'),audio=document.getElementById('audio'),slider=document.getElementById('seek'),label=document.getElementById('time'),status=document.getElementById('status');
let plan=null,frame=0;
let audioURL=null;
fetch('build/soundtrack.wav').then(r=>{if(!r.ok)throw Error(r.status);return r.blob()}).then(blob=>{audioURL=URL.createObjectURL(blob);audio.src=audioURL;audio.load()}).catch(()=>{status.textContent='尚无可播放的混音：运行 mix 后刷新。滑块仍可检查画面。'});
window.addEventListener('beforeunload',()=>{if(audioURL)URL.revokeObjectURL(audioURL)});
fetch('plan.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(p=>{plan=p;slider.max=p.frames-1});
slider.addEventListener('input',()=>{if(!plan)return;frame=Number(slider.value);if(Number.isFinite(audio.duration))audio.currentTime=Math.min(frame/plan.fps,audio.duration)});
audio.addEventListener('seeked',()=>{if(plan){frame=Math.min(plan.frames-1,Math.round(audio.currentTime*plan.fps));slider.value=frame}});
audio.addEventListener('error',()=>{status.textContent='尚无可播放的混音：运行 mix 后刷新。滑块仍可检查画面。'});
audio.addEventListener('canplay',()=>{status.textContent='用下方播放器试听；拖动滑块可逐帧检查高潮和转场。'});
function tick(){if(plan&&view.contentWindow.READY){if(!audio.paused){frame=Math.min(plan.frames-1,Math.floor(audio.currentTime*plan.fps+1e-4));slider.value=frame}view.contentWindow.render(frame/plan.fps);label.value=`${(frame/plan.fps).toFixed(3)}s · frame ${frame}`}requestAnimationFrame(tick)}tick();
</script></body></html>
